[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# forge-std ships its own test suite, and those tests fail here on filesystem permissions and
# mainnet RPC access. They are not ours and their noise buries real failures.
no_match_path = "lib/**"
solc_version = "0.8.23"
optimizer = true
optimizer_runs = 200
# BOT Chain is an EVM L1 on an older target; `paris` avoids emitting PUSH0, which a node without
# Shanghai rejects at deploy time with no useful error.
evm_version = "paris"

[fmt]
line_length = 100
tab_width = 2

[rpc_endpoints]
botchain = "${BOTCHAIN_RPC_URL}"
bohr = "${BOHR_RPC_URL}"

[etherscan]
botchain = { key = "${BOTSCAN_API_KEY}", url = "${BOTSCAN_VERIFIER_URL}", chain = 677 }
bohr = { key = "${BOTSCAN_API_KEY}", url = "${BOHR_VERIFIER_URL}", chain = 968 }
